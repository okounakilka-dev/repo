name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check (CAD automation)
        run: |
          python -m py_compile src/cad-automation/gen_dxf.py src/cad-automation/gen_elec_dxf.py src/cad-automation/gen_hotel_dxf.py src/cad-automation/gen_hotel_elec_utils.py

      - name: Ensure no junk tracked
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '^(bin/|obj/|node_modules/|__pycache__/|\.venv/)|\.blend1$|\.log$' | Select-Object -ExpandProperty Line
          if ($bad) { Write-Error "Junk files tracked:`n$bad"; exit 1 }
          Write-Output "Clean: no junk tracked"
